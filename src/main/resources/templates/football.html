<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container pb-5">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <h1 class="h3 mb-0 me-auto">Football matches</h1>
        <span id="quota" class="small text-muted"></span>
        <button id="refresh" class="btn btn-theme btn-sm py-0 px-2" style="font-size:.8rem">Refresh odds</button>
        <button id="refreshStats" class="btn btn-theme btn-sm py-0 px-2" style="font-size:.8rem">Refresh stats</button>
    </div>
    <!-- Saved times now live in the Refresh pop-ups; kept hidden for reference -->
    <div id="sources" class="d-none"></div>
    <div id="statsStatus" class="small text-muted mb-3"></div>

    <div class="d-flex flex-wrap align-items-center gap-3 mb-3 small">
        <select id="filterComp" class="form-select form-select-sm w-auto"><option value="">All competitions</option></select>
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="filterStarred">
            <label class="form-check-label" for="filterStarred">★ Shortlist only</label>
        </div>
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="filterStarted" checked>
            <label class="form-check-label" for="filterStarted">Hide started matches</label>
        </div>
        <div id="stakeBox" class="ms-auto"></div>
    </div>

    <div id="error" class="alert alert-danger d-none"></div>

    <!-- Confirm before a refresh, so a stray click doesn't use credits/calls -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="confirmTitle"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info px-3 py-2 mb-3 small" id="confirmStatus"></div>
                    <div id="confirmBody"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-theme" id="confirmOk">Refresh</button>
                </div>
            </div>
        </div>
    </div>
    <div id="list"></div>
    <p class="small text-muted mt-3">Prices are Sky Bet odds from the last refresh. Chance = the
        bookmaker's implied chance with its margin removed (hover a badge to see it and its band). Viewing this page is free; only Refresh uses API credits.</p>
</div>

<script src="/js/football-data.js"></script>
<script src="/js/value-check.js"></script>
<script src="/js/match-stats.js"></script>
<script th:inline="none">
(function () {
  var F = window.Football;
  var $ = function (id) { return document.getElementById(id); };
  var matches = [];
  var savedTimes = [];   // [competition, "7 min ago" | "no data yet"] for the Refresh odds pop-up
  var lastStats = null;  // latest Refresh stats status
  var teamsByComp = {};
  var valueByMatch = {};   // match id -> analysis (or 'none'), filled in the background

  /** Value check label for one match (best outcome and numbers on hover). */
  function valueCell(m) {
    var a = valueByMatch[m.id];
    if (a === undefined) return el('span', 'text-muted', '…');
    if (a === 'none' || !a.rows.length) return el('span', 'text-muted', '–');
    var best = a.rows.slice().sort(function (x, y) { return y.ret - x.ret; })[0];
    var span, tip;
    if (best.ret >= 0.05) {
      span = el('span', 'badge rounded-pill ' + best.verdict.cls, best.verdict.text);
      tip = best.name + (best.tag ? ' · ' + best.tag : '') + '\nOur chance ' + Math.round(best.ours * 100) +
            '%, break-even ' + Math.round(100 / best.price) + '%';
    } else {
      span = el('span', 'badge rounded-pill border text-secondary fw-normal', 'No value');
      tip = 'None of home, draw or away is priced generously enough.';
    }
    span.setAttribute('data-bs-toggle', 'tooltip');
    span.setAttribute('data-bs-title', tip);
    span.style.cursor = 'help';
    return span;
  }

  /** Confidence badge for one match. */
  function confidenceCell(m) {
    var a = valueByMatch[m.id];
    if (a === undefined) return el('span', 'text-muted', '…');
    if (a === 'none' || !a.rows.length) return el('span', 'text-muted', '–');
    return ValueCheck.confidenceBadge(a);
  }

  /** Works out the value check for every listed match that hasn't been done yet, then redraws. */
  function loadValues() {
    var todo = matches.filter(function (m) { return valueByMatch[m.id] === undefined && teamsByComp[m.compKey]; });
    Promise.all(todo.map(function (m) {
      var teams = teamsByComp[m.compKey];
      var ht = F.findTeam(teams, m.home_team), at = F.findTeam(teams, m.away_team);
      if (!ht || !at) { valueByMatch[m.id] = 'none'; return null; }
      return MatchStats.loadViews(ht, at).then(function (v) {
        valueByMatch[m.id] = ValueCheck.analyse(m, v.homeVenue, v.awayVenue, F.stake() || ValueCheck.DEFAULT_STAKE) || 'none';
      }).catch(function () { valueByMatch[m.id] = 'none'; });
    })).then(render);
  }
  var STAR_KEY = 'football-shortlist';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function loadStars() { try { return JSON.parse(localStorage.getItem(STAR_KEY) || '[]'); } catch (e) { return []; } }
  function saveStars(s) { try { localStorage.setItem(STAR_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
  var stars = loadStars();

  function ago(iso) {
    var mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 60) return mins + ' min ago';
    if (mins < 48 * 60) return Math.round(mins / 60) + ' h ago';
    return Math.round(mins / 1440) + ' days ago';
  }
  function title(name) {
    return { uefa_champs_league: 'Champions League', uefa_nations_league: 'Nations League',
             uefa_european_championship: 'Euros', fifa_world_cup: 'World Cup' }[name] || name.replace(/_/g, ' ');
  }

  function load() {
    $('error').classList.add('d-none');
    return fetch('/api/football/tournaments').then(function (r) { return r.json(); }).then(function (ts) {
      var cached = ts.filter(function (t) { return t.cached; });
      var notes = ts.filter(function (t) { return !t.cached; }).map(function (t) { return title(t.name) + ': no data yet'; });
      savedTimes = ts.filter(function (t) { return !t.cached; }).map(function (t) { return [title(t.name), 'no data yet']; });
      return Promise.all(cached.map(function (t) {
        return fetch('/api/odds/cache/' + t.key).then(function (r) { return r.json(); }).then(function (c) {
          notes.unshift(title(t.name) + ': odds saved ' + ago(c.fetchedAt));
          savedTimes.unshift([title(t.name), 'saved ' + ago(c.fetchedAt)]);
          return c.events.map(function (ev) { ev.comp = title(t.name); ev.compKey = t.name; return ev; });
        });
      })).then(function (lists) {
        matches = [].concat.apply([], lists).sort(function (a, b) { return a.commence_time.localeCompare(b.commence_time); });
        $('sources').textContent = notes.join(' · ') || 'No competitions configured.';
        var sel = $('filterComp'), keep = sel.value;
        sel.innerHTML = '<option value="">All competitions</option>';
        ts.forEach(function (t) { var o = el('option', null, title(t.name)); o.value = title(t.name); sel.appendChild(o); });
        sel.value = keep;
        render();
        // Crests (one saved football-data.org list per competition), then redraw with logos.
        Promise.all(cached.map(function (t) {
          return F.loadTeams(t.name).then(function (teams) { teamsByComp[t.name] = teams; });
        })).then(render).then(loadValues);
      });
    }).catch(function (e) { notify('Couldn\'t load matches: ' + e.message, 'danger'); });
  }

  function skybet(ev) {
    return ev.bookmakers.find(function (b) { return b.key === 'skybet'; }) || ev.bookmakers[0];
  }
  function market(bk, key) { return bk && bk.markets.find(function (m) { return m.key === key; }); }

  function render() {
    var list = $('list');
    list.innerHTML = '';
    var comp = $('filterComp').value, onlyStars = $('filterStarred').checked, hideStarted = $('filterStarted').checked;
    var shown = matches.filter(function (m) {
      return (!comp || m.comp === comp) && (!onlyStars || stars.indexOf(m.id) >= 0) &&
             (!hideStarted || new Date(m.commence_time) > new Date());
    });
    if (!shown.length) {
      list.appendChild(el('div', 'alert alert-light border', matches.length ? 'No matches match these filters.' : 'No matches cached yet. Click Refresh.'));
      return;
    }
    var day = null, tbody = null;
    shown.forEach(function (m) {
      var start = new Date(m.commence_time);
      var d = start.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      if (d !== day) {
        day = d;
        // One card per day: dark header with the date, matches inside (same look as the match-page widgets)
        var card = el('div', 'card shadow-sm mb-3');
        card.appendChild(el('div', 'card-header py-2 fw-semibold', d));
        var wrap = el('div', 'table-responsive');
        var table = el('table', 'table table-sm table-hover align-middle mb-0 small');
        var head = el('tr', 'text-muted');
        ['', 'Time', 'Competition', 'Match', 'Home', 'Draw', 'Away', 'Value Check', 'Confidence'].forEach(function (h, i) {
          head.appendChild(el('th', i >= 4 && i <= 6 ? 'text-center' : null, h));
        });
        var thead = el('thead'); thead.appendChild(head); table.appendChild(thead);
        tbody = el('tbody'); table.appendChild(tbody);
        wrap.appendChild(table); card.appendChild(wrap); list.appendChild(card);
      }
      var bk = skybet(m), h2h = market(bk, 'h2h'), tot = market(bk, 'totals');
      function price(name) { var o = h2h && h2h.outcomes.find(function (x) { return x.name === name; }); return o ? o.price : null; }
      var ph = price(m.home_team), pd = price('Draw'), pa = price(m.away_team);
      var tr = el('tr');
      var starred = stars.indexOf(m.id) >= 0;
      var starBtn = el('button', 'btn btn-link btn-sm p-0 text-decoration-none ' + (starred ? 'text-dark' : 'text-muted'), starred ? '★' : '☆');
      starBtn.title = 'Add to shortlist';
      starBtn.onclick = function () {
        var i = stars.indexOf(m.id);
        if (i >= 0) stars.splice(i, 1); else stars.push(m.id);
        saveStars(stars); render();
      };
      var td0 = el('td'); td0.appendChild(starBtn); tr.appendChild(td0);
      var timeCell = el('td', 'text-nowrap', start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
      if (start < new Date()) timeCell.appendChild(el('span', 'badge text-bg-danger ms-1', 'LIVE'));
      tr.appendChild(timeCell);
      tr.appendChild(el('td', null, m.comp));
      var teams = teamsByComp[m.compKey] || [];
      var matchCell = el('td', 'fw-semibold');
      var line = el('span', 'd-inline-flex align-items-center gap-1');
      line.appendChild(F.logo(teams, m.home_team, 20));
      line.appendChild(el('span', null, m.home_team));
      line.appendChild(el('span', 'text-muted fw-normal mx-1', 'v'));
      line.appendChild(F.logo(teams, m.away_team, 20));
      line.appendChild(el('span', null, m.away_team));
      matchCell.appendChild(line);
      tr.appendChild(matchCell);
      var chances = (ph && pd && pa) ? F.fairChances([ph, pd, pa]).chances : [null, null, null];
      [ph, pd, pa].forEach(function (p, i) {
        var td = el('td', 'text-center'); td.appendChild(F.oddsBadge(p, chances[i])); tr.appendChild(td);
      });
      // Value check: best-value outcome + confidence, worked out from saved results (same as the match page)
      var tdValue = el('td', 'text-nowrap');
      tdValue.appendChild(valueCell(m));
      tr.appendChild(tdValue);
      var tdConf = el('td');
      tdConf.appendChild(confidenceCell(m));
      tr.appendChild(tdConf);
      // Click anywhere on the row to open the match page
      var href = '/football/match/' + encodeURIComponent(m.id);
      tr.style.cursor = 'pointer';
      tr.addEventListener('click', function (e) {
        if (e.target.closest('a,button')) return;
        location.href = href;
      });
      tbody.appendChild(tr);
    });
  }

  ['filterComp', 'filterStarred', 'filterStarted'].forEach(function (id) { $(id).addEventListener('change', render); });

  /** Spinner on a button while it works: busy(btn, true) / busy(btn, false). */
  function busy(btn, on) {
    var sp = btn.querySelector('.spinner-border');
    if (on && !sp) {
      sp = el('span', 'spinner-border spinner-border-sm me-1');
      sp.style.width = sp.style.height = '.7rem';
      sp.setAttribute('aria-hidden', 'true');
      btn.prepend(sp);
    } else if (!on && sp) {
      sp.remove();
    }
    btn.disabled = on;
    btn.setAttribute('aria-busy', on ? 'true' : 'false');
  }

  function showError(msg) { notify(msg, 'danger'); }

  /** Shows the confirmation pop-up; calls onYes only if Refresh is clicked. */
  /**
   * lead: one sentence; points: short facts shown as a list;
   * status: function returning a Promise of lines for the grey box at the top (when it was last refreshed, credits...).
   */
  function confirmRefresh(title, lead, points, onYes, status) {
    $('confirmTitle').textContent = title;
    var sb = $('confirmStatus');
    sb.replaceChildren(el('span', 'text-muted', 'Checking…'));
    status().then(function (lines) {
      sb.replaceChildren();
      lines.forEach(function (l) {
        var row = el('div', 'd-flex justify-content-between gap-3');
        row.appendChild(el('span', 'text-muted', l[0]));
        row.appendChild(el('span', 'fw-semibold text-end', l[1]));
        sb.appendChild(row);
      });
    }).catch(function () { sb.replaceChildren(el('span', 'text-muted', 'Couldn\'t check the current status.')); });
    var body = $('confirmBody');
    body.replaceChildren(el('p', 'mb-2', lead));
    var ul = el('ul', 'mb-0 text-muted small ps-3');
    points.forEach(function (p) { ul.appendChild(el('li', 'mb-1', p)); });
    body.appendChild(ul);
    var modal = bootstrap.Modal.getOrCreateInstance($('confirmModal'));
    $('confirmOk').onclick = function () { modal.hide(); onYes(); };
    modal.show();
  }

  $('refresh').addEventListener('click', function () {
    var btn = this;
    confirmRefresh('Refresh odds?',
      'Fetches the latest Sky Bet odds for your competitions from The Odds API.',
      ['Uses about 2 credits for each competition with fixtures.',
       'Competitions with no fixtures are skipped for free.',
       'Credits reset on the 1st of each month.'],
      function () { refreshOdds(btn); },
      function () {
        return fetch('/api/odds/cache/quota').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
          .then(function (q) {
            var left = q.remaining !== undefined && q.remaining !== null
              ? Math.round(q.remaining) + ' of ' + (Math.round(q.remaining) + Math.round(q.used || 0)) : 'unknown';
            return [['Credits left this month', left]].concat(savedTimes);
          });
      });
  });

  function refreshOdds(btn) {
    busy(btn, true);
    $('error').classList.add('d-none');
    fetch('/api/football/refresh', { method: 'POST' }).then(function (r) {
      return r.json().then(function (res) {
        if (!r.ok) throw new Error(res.message || ('HTTP ' + r.status));
        var credits = res.reduce(function (t, x) { return t + (x.credits || 0); }, 0);
        $('quota').textContent = 'Last refresh used ' + credits + ' credit(s)';
        notify('Odds refreshed. Used ' + credits + ' credit(s).', 'success');
        return load();
      });
    }).catch(function (e) { showError('Refresh odds failed: ' + e.message); })
      .then(function () { busy(btn, false); });
  }

  $('stakeBox').appendChild(F.stakeInput(render));

  // ---- Refresh stats: runs in the background on the server, we poll its progress ----
  var statsTimer = null;
  function showStats(st) {
    var box = $('statsStatus');
    if (st.running) {
      var pct = st.total ? Math.round(100 * st.done / st.total) : 0;
      box.textContent = 'Refreshing stats from football-data.org: ' + st.done + ' of ~' + st.total + ' calls (' + pct + '%) · ' + st.step +
        '. You can keep using the app.';
      busy($('refreshStats'), true);
      if (!statsTimer) statsTimer = setInterval(pollStats, 2000);
      return;
    }
    if (statsTimer) {
      clearInterval(statsTimer); statsTimer = null;
      notify(st.errors && st.errors.length ? 'Stats refreshed, but ' + st.errors.length + ' call(s) failed.' : 'Stats refreshed.',
             st.errors && st.errors.length ? 'warning' : 'success');
    }
    busy($('refreshStats'), false);
    box.textContent = '';   // when idle, "saved … ago" is shown in the Refresh stats pop-up instead
  }
  function statsJson(r) {
    return r.json().catch(function () { return {}; }).then(function (body) {
      if (!r.ok) throw new Error(r.status === 404 ? 'the app needs a restart to load the stats code' : (body.message || 'HTTP ' + r.status));
      return body;
    });
  }
  function pollStats() {
    fetch('/api/football/stats/refresh').then(statsJson).then(showStats).catch(function () {});
  }
  $('refreshStats').addEventListener('click', function () {
    confirmRefresh('Refresh stats?',
      'Fetches results, form, league tables and top scorers from football-data.org.',
      ['About 17 calls, sent at 10 a minute, so it takes under 2 minutes.',
       'Runs in the background, so you can keep using the app.',
       'Free: football-data.org has no monthly limit.'],
      function () {
        var btn = $('refreshStats');
        busy(btn, true);
        $('error').classList.add('d-none');
        fetch('/api/football/stats/refresh', { method: 'POST' }).then(statsJson).then(showStats)
          .catch(function (e) { busy(btn, false); showError('Refresh stats failed: ' + e.message); });
      }, function () {
        return fetch('/api/football/stats/refresh').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
          .then(function (st) {
            var when = st.running ? 'running now' : st.finishedAt ? 'saved ' + F.ago(st.finishedAt) : 'not saved yet';
            return [['Stats', when]];
          });
      });
  });
  pollStats();
  load();
})();
</script>
</body>
</html>
