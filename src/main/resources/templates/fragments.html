<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="pageHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bet Assistant</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <script defer src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
      // Show a spinner and disable the submit button while a form is posting.
      document.addEventListener('submit', function(event) {
        if (event.defaultPrevented) return;
        var button = event.target.querySelector('button[type="submit"]');
        if (!button || button.disabled) return;
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        var spinner = document.createElement('span');
        spinner.className = 'spinner-border spinner-border-sm me-2';
        spinner.setAttribute('aria-hidden', 'true');
        button.prepend(spinner);
      });
    </script>
    <style>
      html { color-scheme: light; }
      body { margin:0; color:#212529; background:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
      body > .container, nav .container { width:min(1320px, calc(100% - 2rem)); margin-inline:auto; }
      /* Odds badges: chance bands from very likely (dark green) to long shot (dark red) */
      .odds-very-good { background:#0b5d33; color:#fff; }
      .odds-good      { background:#2fa05a; color:#fff; }
      .odds-ok        { background:#f2c12e; color:#212529; }
      .odds-poor      { background:#e0533d; color:#fff; }
      .odds-very-poor { background:#8b1a1a; color:#fff; }
      .odds-tip .tooltip-inner { white-space:pre-line; text-align:left; max-width:260px; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">⚽ Bet Assistant</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="/football">Football</a>
        </div>
    </div>
</nav>

</body>
</html>
