<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: pageHead}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<!--
  Bets page (/bets): every bet worth considering across the upcoming games, one card per day, best first: outcomes
  at a value price (Great / Good / Possible Value; Fair Price has no edge, so isn't listed: Betting Framework §2),
  with the framework's recommended stake. Markets the framework always avoids (correct score, first
  goalscorer) are left out. From the saved odds and stats, so opening it costs no API calls. Click a row to open it.
-->
<div class="container pb-5">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
        <h1 class="h3 mb-0 me-auto">Recommended Bets</h1>
    </div>
    <div class="d-flex flex-wrap align-items-center gap-3 mb-3 small">
        <select id="filterComp" class="form-select form-select-sm w-auto"><option value="">All competitions</option></select>
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="filterFav">
            <label class="form-check-label" for="filterFav">★ Favourites</label>
        </div>
    </div>
    <div id="list"><span class="text-muted small">Checking the upcoming games…</span></div>

    <!-- How accurate the model has been: logged predictions scored against the results -->
    <div class="card shadow-sm mt-4">
        <div class="card-header py-2 fw-semibold">Model Accuracy</div>
        <div class="card-body small" id="accuracy"><span class="text-muted">Loading…</span></div>
        <div class="card-footer bg-transparent py-1 small text-muted d-flex justify-content-between gap-2">
            <span>Predictions are logged before kick-off and at each bet window; results come in with Refresh Stats.</span>
            <span class="text-nowrap">Model version <span id="modelVersion"></span></span>
        </div>
    </div>
</div>

<script src="/js/football-data.js"></script>
<script src="/js/value-check.js"></script>
<script src="/js/match-stats.js"></script>
<script src="/js/favourites.js"></script>
<script src="/js/bets-page.js"></script>
</body>
</html>
